name: Frontend tests

on:
  push:
    paths:
      - "web/**"
      - "assets/**"
      - "lib/robin/web/dist/**"
      - ".github/workflows/frontend-test.yml"
  pull_request:
    paths:
      - "web/**"
      - "assets/**"
      - "lib/robin/web/dist/**"
      - ".github/workflows/frontend-test.yml"
  # Actions > Run workflow (a push that replaces history can't be diffed
  # against the paths above, and starts nothing).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned so the rebuilt bundle matches the committed one byte for byte.
          bun-version: 1.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Tests with 100% line, branch, function and statement coverage
        run: bun run test:coverage
      - name: The committed dashboard build is up to date
        run: |
          bun run build
          git diff --exit-code --stat -- ../lib/robin/web/dist
          test -z "$(git status --porcelain -- ../lib/robin/web/dist)" || { git status --porcelain -- ../lib/robin/web/dist; echo "Run 'cd web && bun run build' and commit lib/robin/web/dist."; exit 1; }
