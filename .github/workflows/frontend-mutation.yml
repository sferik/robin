name: Frontend mutation testing

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/frontend-mutation.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/frontend-mutation.yml"
  # Every module, sharded: Actions > Frontend mutation testing > Run
  # workflow. (A push that replaces history can't be diffed against the
  # paths above, and starts nothing.)
  workflow_dispatch:

permissions:
  contents: read

env:
  # A ceiling on the fan-out: past it, shards grow rather than runners.
  # Stryker reruns the dashboard's tests for each mutant, so a shard of a
  # few modules stays well inside the timeout below.
  MAX_SHARDS: 8

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      # The modules a change touches come from a diff, so the revision it's
      # diffed against has to be in the clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.base_ref }}
      # The modules Stryker mutates (stryker.config.mjs: web/src, but its
      # locales), largest first so dealing them out evens the shards. A pull
      # request mutates those it changes, against its base branch, and a
      # push those changed since the head it replaced. The first push, a
      # push whose old head is gone, a manual run, and a change to what
      # every module is tested with (dependencies, test or Stryker setup)
      # mutate every one. A change to tests alone mutates none.
      - name: Plan the shards
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=$(git rev-parse "origin/${{ github.base_ref }}^{commit}")
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags origin "$base" 2>/dev/null || base=""
          else
            base=""
          fi

          all=$(git ls-files 'web/src/*.ts' 'web/src/*.tsx' | grep -v '^web/src/locales/' | xargs wc -l | grep -v ' total$' | sort -rn | awk '{print $2}')
          setup='^web/(package\.json|bun\.lock|tsconfig\.json|stryker\.config\.mjs|vitest[^/]*\.config\.ts|test/(load|setup|helpers|render_page)[^/]*\.tsx?)$'
          if [ -z "$base" ] || git diff --name-only "$base" | grep -qE "$setup"; then
            echo "Mutating every module"
            modules="$all"
          else
            echo "Mutating the modules changed since $base"
            changed=$(git diff --name-only --diff-filter=d "$base" -- web/src)
            modules=$(grep -Fxf <(printf '%s\n' "$changed") <<< "$all" || true)
          fi

          count=$(printf '%s\n' "$modules" | grep -c . || true)
          total=$(( count < MAX_SHARDS ? count : MAX_SHARDS ))
          echo "$count module(s) across $total shard(s)"
          {
            echo "modules=$(printf '%s\n' "$modules" | grep . | sed 's|^web/||' | jq -Rnc '[inputs]')"
            echo "total=$total"
            echo "shards=$(jq -nc --argjson n "$total" '[range($n)]')"
          } >> "$GITHUB_OUTPUT"

  # A change that touches no module (tests or docs alone) never gets here.
  mutate:
    name: Mutation score 100%, shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.total != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every shard reports its own survivors: stopping the others on the
      # first failure would hide the rest.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Every total-th module, from this shard's place on.
      - name: Stryker on this shard's modules (fails below a 100% mutation score)
        env:
          MODULES: ${{ needs.plan.outputs.modules }}
        run: |
          mine=$(jq -r --argjson i "${{ matrix.shard }}" --argjson n "${{ needs.plan.outputs.total }}" \
            'to_entries | map(select(.key % $n == $i) | .value) | join(",")' <<< "$MODULES")
          echo "Mutating $mine"
          bun run test:mutation --mutate "$mine"
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-mutation-report-${{ matrix.shard }}
          path: web/reports/mutation/
