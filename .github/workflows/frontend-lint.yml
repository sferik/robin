name: Frontend lint

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/frontend-lint.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/frontend-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - name: ESLint (typescript-eslint strict, jsx-a11y, hooks)
        run: bun run lint
      - name: Type check
        run: bun run typecheck
