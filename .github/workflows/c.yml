name: C extension

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CLANG_FORMAT_VERSION: "23.1.3"
  CLANG_TIDY_VERSION: "22.1.8"

jobs:
  lint:
    name: Lint (clang-format, clang-tidy, -Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "clang-format==$CLANG_FORMAT_VERSION" "clang-tidy==$CLANG_TIDY_VERSION"
      - run: bundle exec rake c:lint

  coverage:
    name: Coverage (100% line, branch and function)
    runs-on: ubuntu-latest
    env:
      CC: clang
      GCOVR: gcovr --gcov-executable "llvm-cov gcov"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/redis
      - run: sudo apt-get install -y -qq clang llvm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install gcovr
      - run: bundle exec rake c:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c-coverage
          path: tmp/c-coverage/*.html
