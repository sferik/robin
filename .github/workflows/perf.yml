name: Performance

# Robin may never get slower (see CONTRIBUTING.md). Duel measures every
# pull request against the branch it targets, a merge queue's group
# against the queue's base, and every push to main against the last
# commit Duel passed (c.push_base in .duel.rb), so slowdowns each too
# small to fail a push add up until they fail one. Each night it measures
# main against the last release too.
on:
  push:
    branches: [main]
  pull_request:
  merge_group: # (a merge queue's)
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its run, if that's still going, as
# only its newest commit's result counts. Every other run (a push's, say)
# runs to the end, so that each push is compared.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf:
    name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'Since the last release' || 'Performance' }} (${{ matrix.jit }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # CRuby with YJIT and without, and JRuby (where the Java extension
        # is measured; its JIT makes timings noisier, so small timing
        # regressions there go unsettled, but its counts are exact).
        jit: [yjit, interpreter, jruby]
    # Whether to mark a push passed (true, or nothing), from Duel. (Every
    # leg says the same where all of them pass, and the Mark the commit
    # passed job runs only then.)
    outputs:
      passed: ${{ steps.compare.outputs.passed }}
    env:
      RUBY_YJIT_ENABLE: ${{ matrix.jit == 'yjit' && '1' || '0' }}
      # A pull request: the branch it targets (Duel's default). A merge
      # queue: its base. A push: the commit before it (which Duel replaces
      # with the last commit it passed). Nightly: the newest release tag.
      DUEL_BASE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'last-release' || github.event_name == 'push' && github.event.before || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the baseline is checked out from history, tags included
      # Each version of Robin gets a Redis server of its own.
      - name: Install redis-server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo systemctl stop redis-server
      - uses: actions/setup-java@v6
        if: matrix.jit == 'jruby'
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.jit == 'jruby' && 'jruby-10.1' || '3.4' }}
          bundler-cache: true
      - name: Compare against the baseline
        id: compare
        # (A push whose commit before it isn't in the history, such as a
        # branch's first, passes with nothing to compare.)
        run: bundle exec duel

  # With c.push_base = :last_passed in .duel.rb, a push is compared with
  # the last commit Duel passed, which a branch marks (duel/passed/main).
  # This job moves the branch to a push that every leg passed (or makes
  # it). It checks nothing out and runs none of the code. To accept a
  # regression, move the branch yourself: git push origin
  # main:duel/passed/main.
  passed:
    name: Mark the commit passed
    needs: perf
    if: ${{ !cancelled() && github.event_name == 'push' && needs.perf.result == 'success' && needs.perf.outputs.passed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to move the branch
    steps:
      - name: Move the branch to the commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: duel/passed/${{ github.ref_name }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$GITHUB_SHA" -F force=true > /dev/null 2>&1 ||
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$GITHUB_SHA" > /dev/null
