name: Performance

# Robin may never get slower (see CONTRIBUTING.md). Duel measures every
# pull request against the branch it targets, a merge queue's group
# against the queue's base, and every push to main against the last
# commit Duel passed (c.push_base in .duel.rb), so slowdowns each too
# small to fail a push add up until they fail one. Each night it measures
# main against the last release too.
on:
  push:
    branches: [main]
  pull_request:
  merge_group: # (a merge queue's)
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its run, if that's still going, as
# only its newest commit's result counts. Every other run (a push's, say)
# runs to the end, so that each push is compared.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf:
    name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'Since the last release' || 'Performance' }} (${{ matrix.jit }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # CRuby with YJIT and without, and JRuby (where the Java extension
        # is measured; its JIT makes timings noisier, so small timing
        # regressions there go unsettled, but its counts are exact).
        jit: [yjit, interpreter, jruby]
    # Whether to mark a push passed (true, or nothing), and the run's
    # status (passed, failed, error or nothing_to_compare), from Duel. (Every
    # leg says the same where all of them pass, and the Mark the commit
    # passed job runs only then. A leg that fails fails the job, which
    # turns the badge red whatever the status.)
    outputs:
      passed: ${{ steps.compare.outputs.passed }}
      status: ${{ steps.compare.outputs.status }}
    env:
      RUBY_YJIT_ENABLE: ${{ matrix.jit == 'yjit' && '1' || '0' }}
      # A pull request: the branch it targets (Duel's default). A merge
      # queue: its base. A push: the commit before it (which Duel replaces
      # with the last commit it passed). Nightly: the newest release tag.
      DUEL_BASE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'last-release' || github.event_name == 'push' && github.event.before || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the baseline is checked out from history, tags included
      # Each version of Robin gets a Redis server of its own.
      - name: Install redis-server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo systemctl stop redis-server
      - uses: actions/setup-java@v6
        if: matrix.jit == 'jruby'
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.jit == 'jruby' && 'jruby-10.1' || '3.4' }}
          bundler-cache: true
      - name: Compare against the baseline
        id: compare
        # (A push whose commit before it isn't in the history, such as a
        # branch's first, passes with nothing to compare.)
        run: bundle exec duel

  # With c.push_base = :last_passed in .duel.rb, a push is compared with
  # the last commit Duel passed, which a branch marks (duel/passed/main).
  # This job moves the branch to a push that every leg passed (or makes
  # it), but never back: where a newer push's run moved it first, it
  # stays. It checks nothing out and runs none of the code. To accept a
  # regression, move the branch yourself: git push origin
  # main:duel/passed/main.
  passed:
    name: Mark the commit passed
    needs: perf
    if: ${{ !cancelled() && github.event_name == 'push' && needs.perf.result == 'success' && needs.perf.outputs.passed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to move the branch
    steps:
      - name: Move the branch to the commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: duel/passed/${{ github.ref_name }}
        run: |
          # (Git can't make a branch where another's name is a folder of its
          # name: a branch named duel blocks duel/passed/main. If one does,
          # this names it.)
          blocked() {
            prefix=$BRANCH
            while [ "${prefix%/*}" != "$prefix" ]; do
              prefix=${prefix%/*}
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$prefix" > /dev/null 2>&1; then
                echo "::error::The branch $prefix keeps Duel from making $BRANCH, as Git can't have both. Delete it (git push origin --delete $prefix), or rename it."
              fi
            done
            exit 1
          }
          # (Forward: GitHub moves it only where it's behind the push.)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$GITHUB_SHA" > /dev/null 2>&1 && exit 0
          at=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null) || at=
          if [ -z "$at" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$GITHUB_SHA" > /dev/null || blocked
            exit 0
          fi
          compared=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$at" --jq .status 2>&1) || case "$compared" in
            # (GitHub can't compare commits with no history in common.)
            *"No common ancestor"*) compared=unrelated ;;
          esac
          case "$compared" in
            # (A newer push's run moved it, or this one's did, run again.)
            ahead | identical) ;;
            # (History rewritten, a force push's, say, or replaced: moved anyway.)
            diverged | behind | unrelated) gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$GITHUB_SHA" -F force=true > /dev/null ;;
            *) echo "::error::Couldn't compare $BRANCH with this push: $compared" && exit 1 ;;
          esac

  # Duel's badge, for the README: green (perf guarded) or red (perf
  # regressed), as the last push to the default branch that Duel compared
  # left it. It's red where the Duel job failed or found a regression,
  # even one that passed (with c.fail_on = :pull_requests in .duel.rb). A
  # push with nothing to compare leaves it as it was, and so does a run
  # for an older push than the badge's. This job writes the badge, alone,
  # to a branch of its own, which the README shows:
  #
  #   [![Duel](https://raw.githubusercontent.com/sferik/robin/duel/badge/badge.svg)](https://github.com/sferik/duel-ruby)
  #
  # It checks nothing out and runs none of the code.
  badge:
    name: Update the badge
    needs: perf
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && (needs.perf.result == 'failure' || needs.perf.outputs.status == 'passed' || needs.perf.outputs.status == 'failed') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to move the badge's branch
    steps:
      - name: Update the badge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: duel/badge
          RESULT: ${{ needs.perf.result }}
          STATUS: ${{ needs.perf.outputs.status }}
          BADGES: https://raw.githubusercontent.com/sferik/duel-ruby/main/assets
        run: |
          # (Git can't make a branch where another's name is a folder of its
          # name: a branch named duel blocks duel/passed/main. If one does,
          # this names it.)
          blocked() {
            prefix=$BRANCH
            while [ "${prefix%/*}" != "$prefix" ]; do
              prefix=${prefix%/*}
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$prefix" > /dev/null 2>&1; then
                echo "::error::The branch $prefix keeps Duel from making $BRANCH, as Git can't have both. Delete it (git push origin --delete $prefix), or rename it."
              fi
            done
            exit 1
          }
          # (Where the badge is a newer push's, that push's run has the say.
          # Its commit names the push.)
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .commit.message 2>/dev/null | sed -n 's/^Duel.s badge, for \([0-9a-f]*\)$/\1/p') || true
          if [ -n "$last" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$last" --jq .status 2>/dev/null)" = ahead ]; then exit 0; fi
          badge="badge.svg"
          if [ "$RESULT" = failure ] || [ "$STATUS" = failed ]; then badge="badge-regressed.svg"; fi
          curl -fsSL "$BADGES/$badge" -o "$RUNNER_TEMP/badge.svg"
          tree=$(jq -n --rawfile svg "$RUNNER_TEMP/badge.svg" '{tree: [{path: "badge.svg", mode: "100644", type: "blob", content: $svg}]}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)
          commit=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" -f message="Duel's badge, for $GITHUB_SHA" -f tree="$tree" --jq .sha)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$commit" -F force=true > /dev/null 2>&1 ||
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$commit" > /dev/null || blocked
