name: Perf

# Duel's performance regression guards, run by Duel's reusable workflow
# (see Duel's docs/ci.md), which this one calls with what .duel.rb sets
# that it needs: it compares a pull request with the branch it targets,
# a merge queue's group with the queue's base, a push with what was there
# before (or as c.push_base in .duel.rb says, the last commit Duel
# passed), and on a schedule, the last release (slow creep).
on:
  pull_request:
  merge_group: # (a merge queue's)
  push:
    branches: [main] # (and any other branch to guard, a stable one, say)
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# A pull request's newer push cancels its run, if that's still going, as
# only its newest commit's result counts. Every other run (a push's, say)
# runs to the end, so that each push is compared.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Duel's jobs, which run the branch's code, so they only read: one for
  # each runtime Robin runs on, each a check and a report of its own,
  # which the Perf comment workflow comments with together.
  yjit:
    uses: sferik/duel-ruby/.github/workflows/duel.yml@v0.3.1
    permissions:
      contents: read
      pull-requests: read # for the pull request's labels (see c.accept_label)
    with:
      ruby-version: "3.4"
      jit: yjit
      timeout-minutes: 30
      report: yjit
      # (duel-redis starts a redis-server of its own for each worker.)
      setup: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq redis-server
        sudo systemctl stop redis-server

  interpreter:
    uses: sferik/duel-ruby/.github/workflows/duel.yml@v0.3.1
    permissions:
      contents: read
      pull-requests: read # for the pull request's labels (see c.accept_label)
    with:
      ruby-version: "3.4"
      timeout-minutes: 30
      report: interpreter
      # (duel-redis starts a redis-server of its own for each worker.)
      setup: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq redis-server
        sudo systemctl stop redis-server

  jruby:
    uses: sferik/duel-ruby/.github/workflows/duel.yml@v0.3.1
    permissions:
      contents: read
      pull-requests: read # for the pull request's labels (see c.accept_label)
    with:
      ruby-version: "jruby-10.1"
      # (JRuby's workers take minutes to start and warm up, and a whole
      # comparison some 30 to 45 more.)
      timeout-minutes: 60
      report: jruby
      # (duel-redis starts a redis-server of its own for each worker. JRuby
      # 10 needs Java 21, which the runner has.)
      setup: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq redis-server
        sudo systemctl stop redis-server
        echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

  # For a push, the jobs that comment on the commit, mark it passed, and
  # keep the badge, which run none of the code. They write, so they're
  # calls of their own. A push is marked passed only when Duel passed it
  # on every runtime, so the one that marks it waits for all three, and
  # keeps the badge, failed if any failed. The other two only comment.
  yjit-push:
    needs: [yjit, interpreter, jruby]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    uses: sferik/duel-ruby/.github/workflows/duel-push.yml@v0.3.1
    permissions:
      contents: write # to comment on the commit, move the passed branch, and the badge's
    with:
      comment: ${{ needs.yjit.outputs.comment }}
      status: ${{ contains(fromJSON(format('["{0}","{1}","{2}"]', needs.yjit.outputs.status, needs.interpreter.outputs.status, needs.jruby.outputs.status)), 'failed') && 'failed' || needs.yjit.outputs.status }}
      passed: ${{ needs.yjit.result == 'success' && needs.interpreter.result == 'success' && needs.jruby.result == 'success' && needs.yjit.outputs.passed || '' }}
      result: ${{ (needs.yjit.result == 'failure' || needs.interpreter.result == 'failure' || needs.jruby.result == 'failure') && 'failure' || needs.yjit.result }}
      report: yjit
      badge: true

  interpreter-push:
    needs: interpreter
    if: ${{ !cancelled() && github.event_name == 'push' }}
    uses: sferik/duel-ruby/.github/workflows/duel-push.yml@v0.3.1
    permissions:
      contents: write # to comment on the commit
    with:
      comment: ${{ needs.interpreter.outputs.comment }}
      status: ${{ needs.interpreter.outputs.status }}
      result: ${{ needs.interpreter.result }}
      report: interpreter

  jruby-push:
    needs: jruby
    if: ${{ !cancelled() && github.event_name == 'push' }}
    uses: sferik/duel-ruby/.github/workflows/duel-push.yml@v0.3.1
    permissions:
      contents: write # to comment on the commit
    with:
      comment: ${{ needs.jruby.outputs.comment }}
      status: ${{ needs.jruby.outputs.status }}
      result: ${{ needs.jruby.result }}
      report: jruby
