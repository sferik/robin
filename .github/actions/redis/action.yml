name: Start Redis
description: >-
  Start Redis, Valkey or Dragonfly in Docker, listening on a Unix socket
  (avoids exhausting TCP ports under parallel test runs)
inputs:
  server:
    description: redis, valkey or dragonfly
    default: redis
  version:
    description: The server's image tag
    default: "8.10"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SERVER: ${{ inputs.server }}
        VERSION: ${{ inputs.version }}
      run: |
        mkdir -p /tmp/redis && chmod 777 /tmp/redis
        socket=/tmp/redis/redis.sock
        rm -f "$socket"
        case "$SERVER" in
          redis | valkey)
            image="$SERVER:$VERSION"
            [ "$SERVER" = valkey ] && image="valkey/valkey:$VERSION"
            args=("$SERVER-server" --port 0 --unixsocket "$socket" --unixsocketperm 777
              --save "" --appendonly no --maxclients 20000)
            ;;
          dragonfly)
            image="docker.dragonflydb.io/dragonflydb/dragonfly:$VERSION"
            # Robin's Lua scripts build some key names from the key prefix.
            args=(--unixsocket="$socket" --unixsocketperm=777 --dbfilename= --maxclients=20000
              --default_lua_flags=allow-undeclared-keys)
            ;;
          *) echo "unknown server: $SERVER" >&2; exit 1 ;;
        esac
        docker run -d --name redis --ulimit memlock=-1 -v /tmp/redis:/tmp/redis "$image" "${args[@]}"
        ready=false
        for i in $(seq 1 50); do
          if python3 - "$socket" 2>/dev/null <<'PY'; then ready=true; break; fi
        import socket, sys
        s = socket.socket(socket.AF_UNIX)
        s.connect(sys.argv[1])
        s.sendall(b"PING\r\n")
        sys.exit(0 if s.recv(16).startswith(b"+PONG") else 1)
        PY
          sleep 0.2
        done
        docker logs redis 2>&1 | tail -5
        if [ "$ready" != true ]; then echo "$SERVER $VERSION didn't answer on $socket" >&2; exit 1; fi
        echo "ROBIN_TEST_REDIS_URL=unix://$socket?db=15" >> "$GITHUB_ENV"
